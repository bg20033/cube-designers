<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      try {
        if (sessionStorage.getItem("cube-intro-entered") === "1") {
          document.documentElement.dataset.introSeen = "true"
        }
      } catch {}
    </script>
    <script>
      if (location.pathname === "/shop" && /[?&](category|q|saved|max|sort)=/.test(location.search)) {
        document.documentElement.dataset.shopPending = "true"
      }
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
